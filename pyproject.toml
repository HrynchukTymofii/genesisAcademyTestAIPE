[project]
name = "wiki-interest"
version = "0.1.0"
description = "Analyze Wikipedia pageview trends to compare topic interest across language editions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "reportlab>=4.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
wiki-interest = "wiki_interest.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_interest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
